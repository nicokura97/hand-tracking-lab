<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Volante — esquivá con las dos manos</title>
<style>
  html, body { margin:0; height:100%; background:#07090f; color:#e6e6e6;
               font-family: system-ui, sans-serif; overflow:hidden; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8); }
  #stage > * { position:absolute; inset:0; width:100%; height:100%; }
  video { object-fit:fill; transform:scaleX(-1); opacity:0; }   /* oculta por defecto: solo se ve la ruta 3D */
  canvas { pointer-events:none; }
  #hud { position:absolute; top:12px; left:0; right:0; text-align:center; pointer-events:none; }
  #score { font-size:28px; font-weight:800; text-shadow:0 2px 6px rgba(0,0,0,.8); }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
         text-align:center; pointer-events:none; }
  #msg .box { background:rgba(0,0,0,.55); padding:18px 26px; border-radius:14px; font-size:18px;
              line-height:1.5; max-width:80%; }
  #msg .big { font-size:34px; font-weight:800; margin-bottom:6px; }
  #msg.hidden { display:none; }
  #status { position:absolute; bottom:10px; right:10px; font-size:12px; color:#9fd;
            background:rgba(0,0,0,.5); padding:6px 10px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud"><div id="score">0 m</div></div>
    <div id="msg"><div class="box">
      <div class="big">🚗 Volante a dos manos</div>
      Mostrá las dos manos frente a la cámara (donde te resulte cómodo)<br/>
      Girálas como un volante real para esquivar los conos
    </div></div>
    <div id="status">cargando…</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { HandLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const stage = document.getElementById("stage");
const scoreEl = document.getElementById("score");
const msgEl = document.getElementById("msg");
const statusEl = document.getElementById("status");

const CAM_W = 960, CAM_H = 720, ASPECT = CAM_W / CAM_H;

// ---------- ajustes de sensación ----------
const MAX_WHEEL_ANGLE = Math.PI * 0.62;
const STEER_ACCEL = 7.5, LATERAL_DAMPING = 3.2, ROAD_HALF_WIDTH = 2.6;
const BASE_SPEED = 7, SPEED_RAMP = 0.012, MAX_SPEED = 16;
const LANES = [-1.7, 0, 1.7];
const SPAWN_AHEAD = 46, SPAWN_INTERVAL = 1.15, COLLISION_WINDOW = 0.45, COLLISION_DIST = 0.85;

// centro de la mano = promedio de los 4 nudillos (MCP) -> punto estable sin importar
// la pose exacta de los dedos (cerrar el puño hace que MediaPipe pierda precisión
// por los dedos que se ocultan entre sí, así que no exigimos ningún gesto específico)
function fistCenter(lm) {
  const idx = [5,9,13,17];
  let x=0,y=0;
  for (const i of idx) { x += lm[i].x; y += lm[i].y; }
  return { mx: 1-x/idx.length, my: y/idx.length };
}
function angleDelta(a,b){ let d=a-b; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return d; }

// ---------- escena ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaed9ff);
scene.fog = new THREE.Fog(0xaed9ff, 35, 130);
const camera = new THREE.PerspectiveCamera(55, ASPECT, 0.1, 200);
scene.add(camera);              // necesario para que se rendericen los hijos de camera (el volante)
camera.position.set(0, 1.1, 5);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb98c, 1.8));
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(3,8,4); scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// piso sólido (pasto) + grilla encima (sensación de movimiento) -> ambos siguen a la cámara
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color:0x8fbf6a, roughness:0.9 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.03;
scene.add(ground);
const grid = new THREE.GridHelper(120, 40, 0xffffff, 0xdfe9c8);
grid.position.y = -0.02;
scene.add(grid);

// volante: pegado a la cámara -> siempre en el mismo lugar de la pantalla (vista de cabina)
const wheel = new THREE.Group();
const rimMat = new THREE.MeshStandardMaterial({ color:0x20262f, metalness:0.6, roughness:0.35 });
wheel.add(new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.07, 14, 36), rimMat));
wheel.add(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.06), rimMat));
wheel.add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.06), rimMat));
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.1,16),
  new THREE.MeshStandardMaterial({ color:0x3f7fd0, metalness:0.5, roughness:0.3 }));
hub.rotation.x = Math.PI/2; wheel.add(hub);
wheel.position.set(0, -0.62, -1.6);
camera.add(wheel);

function layout() {
  let w = innerWidth, h = innerHeight;
  if (w/h > ASPECT) w = h*ASPECT; else h = w/ASPECT;
  stage.style.width = w+"px"; stage.style.height = h+"px";
  renderer.setSize(w,h,false);
  camera.aspect = ASPECT; camera.updateProjectionMatrix();
  overlay.width = w*devicePixelRatio; overlay.height = h*devicePixelRatio;
  octx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize", layout); layout();

const toPx = (mx,my) => ({ x: mx*stage.clientWidth, y: my*stage.clientHeight });

// ---------- estado del juego ----------
let gameState = "idle";     // idle | playing | over
let traveled = 0, score = 0, speed = BASE_SPEED;
let playerX = 0, playerVX = 0;
let wheelAngle = 0, wheelRef = null;
let obstacles = [], nextSpawnAt = 14;

function resetGame() {
  for (const o of obstacles) { scene.remove(o.mesh); o.mesh.geometry.dispose(); o.mesh.material.dispose(); }
  obstacles = []; nextSpawnAt = 14;
  traveled = 0; score = 0; speed = BASE_SPEED;
  playerX = 0; playerVX = 0; wheelAngle = 0; wheelRef = null;
  camera.position.x = 0; camera.position.z = 5;
}

function maybeSpawn() {
  while (nextSpawnAt < traveled + SPAWN_AHEAD) {
    const lane = LANES[Math.floor(Math.random()*LANES.length)];
    const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.05, 10),
      new THREE.MeshStandardMaterial({ color: 0xff8f4f, metalness:0.2, roughness:0.6 }));
    mesh.position.set(lane, 0.5, 5 - nextSpawnAt);
    scene.add(mesh);
    obstacles.push({ mesh, travelPos: nextSpawnAt, resolved:false });
    nextSpawnAt += SPAWN_INTERVAL * (0.75 + Math.random()*0.6);
  }
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
function drawHand(lm, color) {
  octx.strokeStyle = color; octx.lineWidth = 3; octx.globalAlpha = 0.85;
  for (const [a,b] of HAND_CONNECTIONS) {
    const p = toPx(1-lm[a].x, lm[a].y), q = toPx(1-lm[b].x, lm[b].y);
    octx.beginPath(); octx.moveTo(p.x,p.y); octx.lineTo(q.x,q.y); octx.stroke();
  }
  octx.globalAlpha = 1; octx.fillStyle = color;
  for (const l of lm) { const p = toPx(1-l.x,l.y); octx.beginPath(); octx.arc(p.x,p.y,3.5,0,Math.PI*2); octx.fill(); }
}

let lastFrame = performance.now();
function render() {
  requestAnimationFrame(render);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrame)/1000);
  lastFrame = now;

  if (gameState === "playing") {
    speed = Math.min(MAX_SPEED, BASE_SPEED + traveled*SPEED_RAMP);
    traveled += speed * dt;

    playerVX += wheelAngle * STEER_ACCEL * dt;
    playerVX -= playerVX * LATERAL_DAMPING * dt;
    playerX = THREE.MathUtils.clamp(playerX + playerVX*dt, -ROAD_HALF_WIDTH, ROAD_HALF_WIDTH);

    camera.position.z = 5 - traveled;
    camera.position.x += (playerX - camera.position.x) * Math.min(1, 10*dt);
    grid.position.z = camera.position.z - 60;
    ground.position.z = camera.position.z - 60;

    maybeSpawn();
    for (let i = obstacles.length-1; i>=0; i--) {
      const o = obstacles[i];
      if (!o.resolved) {
        if (traveled >= o.travelPos - COLLISION_WINDOW && traveled <= o.travelPos + COLLISION_WINDOW) {
          if (Math.abs(o.mesh.position.x - playerX) < COLLISION_DIST) {
            o.resolved = true; gameState = "over";
            msgEl.classList.remove("hidden");
            msgEl.querySelector(".box").innerHTML =
              `<div class="big">💥 Chocaste</div>Distancia: ${Math.floor(traveled)} m · ${score} conos esquivados<br/>` +
              `Mostrá las dos manos para reintentar`;
          }
        } else if (traveled > o.travelPos + COLLISION_WINDOW) { o.resolved = true; score++; }
      }
      if (traveled > o.travelPos + 6) { scene.remove(o.mesh); o.mesh.geometry.dispose(); o.mesh.material.dispose(); obstacles.splice(i,1); }
    }
  } else {
    wheelAngle += (0 - wheelAngle) * Math.min(1, 6*dt);
  }

  wheel.rotation.z = wheelAngle;
  scoreEl.textContent = gameState === "idle" ? "" : `${Math.floor(traveled)} m · 🚧 ${score}`;
  renderer.render(scene, camera);
}
render();

async function main() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                  delegate:"GPU" },
    runningMode:"VIDEO", numHands:2 });

  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video:{ width:CAM_W, height:CAM_H }, audio:false });
  await new Promise(r => video.onloadedmetadata = r);
  video.play(); layout();
  statusEl.textContent = "listo";
  resetGame();

  let last = -1;
  function loop() {
    if (video.currentTime !== last) {
      last = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      octx.clearRect(0,0,stage.clientWidth, stage.clientHeight);

      const hands = (res.landmarks || []).map((lm) => {
        const { mx, my } = fistCenter(lm);
        return { lm, mx, my };
      });

      // básico: alcanza con que se detecten las dos manos, sin exigir ningún gesto
      // específico -> el ángulo ENTRE ellas es el volante.
      const holding = hands.length >= 2;

      if (holding) {
        const [a,b] = hands;
        // mx ya viene espejado-corregido desde fistCenter (1 - x crudo) -> usarlo directo,
        // NO volver a invertir acá (eso cancelaba la corrección y giraba al revés).
        const rawAngle = Math.atan2(b.my-a.my, b.mx-a.mx);
        if (!wheelRef) wheelRef = { angle0: rawAngle, visual0: wheelAngle };
        else {
          const delta = angleDelta(rawAngle, wheelRef.angle0);
          wheelAngle = THREE.MathUtils.clamp(wheelRef.visual0 + delta, -MAX_WHEEL_ANGLE, MAX_WHEEL_ANGLE);
        }
        if (gameState === "idle") { gameState = "playing"; msgEl.classList.add("hidden"); }
        else if (gameState === "over") { resetGame(); gameState = "playing"; msgEl.classList.add("hidden"); }
      } else {
        wheelRef = null;
      }

      for (const h of hands) drawHand(h.lm, holding ? "#6cf08a" : "#7fd4ff");

      // línea entre las dos manos cuando hay control -> el "volante" que estás formando
      if (holding) {
        const [a,b] = hands;
        const pa = toPx(a.mx, a.my), pb = toPx(b.mx, b.my);
        octx.strokeStyle = "rgba(108,240,138,.7)"; octx.lineWidth = 3;
        octx.beginPath(); octx.moveTo(pa.x,pa.y); octx.lineTo(pb.x,pb.y); octx.stroke();
      }

      if (gameState === "playing" && hands.length === 1) {
        statusEl.textContent = "falta la otra mano";
      } else statusEl.textContent = "";
    }
    requestAnimationFrame(loop);
  }
  loop();
}

main().catch(e => { statusEl.textContent = "error: "+e.message; console.error(e); });
</script>
</body>
</html>
