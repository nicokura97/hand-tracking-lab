<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Torre AR — anclada al piso real (WebXR)</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; }
  #score { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
           font-size:22px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.85); pointer-events:none; }
  #hint { position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
          font-size:14px; color:#dfe6f0; text-shadow:0 2px 6px rgba(0,0,0,.85); padding:0 24px; pointer-events:none; }
  #debug { position:fixed; top:calc(48px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
           font-size:11px; color:#8fe0b0; text-shadow:0 2px 6px rgba(0,0,0,.85); pointer-events:none; }
  #unsupported { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
                 text-align:center; padding:28px; background:#07090f; }
  #unsupported.hidden { display:none; }
  #unsupported .big { font-size:20px; font-weight:800; margin-bottom:10px; }
  #unsupported p { color:#b9c4d4; line-height:1.5; }
  #camPreview { position:fixed; right:calc(10px + env(safe-area-inset-right)); bottom:calc(90px + env(safe-area-inset-bottom));
                width:130px; height:98px; border:2px solid #6cf08a; border-radius:8px;
                box-shadow:0 4px 14px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="score"></div>
<div id="debug"></div>
<div id="hint">Apuntá al piso o a una mesa y tocá para anclar la torre</div>
<div id="unsupported" class="hidden">
  <div>
    <div class="big">⚠️ Este navegador no soporta AR con anclaje real</div>
    <p>Necesitás Chrome en Android (con ARCore). En iPhone/Safari todavía no está disponible.</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { ARButton } from "three/addons/webxr/ARButton.js";
import * as CANNON from "cannon-es";
import { HandLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

const scoreEl = document.getElementById("score");
const hintEl = document.getElementById("hint");
const debugEl = document.getElementById("debug");
const unsupportedEl = document.getElementById("unsupported");

if (!navigator.xr) {
  unsupportedEl.classList.remove("hidden");
} else {
  navigator.xr.isSessionSupported("immersive-ar").then(ok => { if (!ok) unsupportedEl.classList.remove("hidden"); });
}

// medidas en METROS REALES (WebXR usa escala 1:1 con el mundo, no unidades arbitrarias)
const CUBE_SIZE = 0.12;
const JITTER = 0.012;       // desvío horizontal al azar en cada cubo -> con la torre alta, se puede caer sola
const STAGE_OFFSET = 0.22;  // a qué distancia del ancla aparece el próximo cubo, sobre el piso real

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(ARButton.createButton(renderer, {
  requiredFeatures: ["hit-test"],
  optionalFeatures: ["camera-access", "dom-overlay"],
  domOverlay: { root: document.body }
}));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(0.5,1,0.3); scene.add(key);

// anillo que muestra dónde vas a anclar la torre, antes de tocar
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0x6cf08a })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- física (misma que ya probamos: gravedad, colisión, sin auto-alinear) ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0,-9.82,0) });
world.allowSleep = true;
const cMat = new CANNON.Material("cube");
world.defaultContactMaterial = new CANNON.ContactMaterial(cMat, cMat, { friction:0.5, restitution:0.05 });

function makeBody(x,y,z,type,mass) {
  const body = new CANNON.Body({ mass, type, material:cMat,
    shape: new CANNON.Box(new CANNON.Vec3(CUBE_SIZE/2,CUBE_SIZE/2,CUBE_SIZE/2)) });
  body.position.set(x,y,z);
  body.linearDamping = 0.3; body.angularDamping = 0.4;
  world.addBody(body);
  return body;
}
function makeMesh(color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(CUBE_SIZE,CUBE_SIZE,CUBE_SIZE),
    new THREE.MeshStandardMaterial({ color, metalness:0.2, roughness:0.6 }));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
    new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.5 })));
  return m;
}

let anchored = false, anchorX = 0, anchorZ = 0, groundY = 0, stackTopY = 0, count = 0;
const cubes = [];       // ya soltados -> la física los maneja
let staging = null;     // { mesh, body } esperando en el piso, listo para agregar
let carrying = false;   // true mientras sostenés el cubo con la pinza

const GRAB_RADIUS = 0.25;   // qué tan cerca (en metros reales) tiene que apuntar tu mano al cubo para agarrarlo
const groundRaycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
// dónde apunta tu mano en el mundo real, proyectada sobre el piso detectado (no hay forma de saber
// la distancia real cámara->mano con una sola cámara, así que usamos el piso como referencia)
function imagePointToGround(u, v) {
  const ndc = new THREE.Vector2(u*2-1, -(v*2-1));
  groundRaycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  return groundRaycaster.ray.intersectPlane(groundPlane, hit) ? hit : null;
}

function placeAnchor(x, y, z) {
  const groundBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane(), material:cMat });
  groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
  groundBody.position.set(0, y, 0);
  world.addBody(groundBody);
  groundPlane.constant = -y;

  const body = makeBody(x, y + CUBE_SIZE/2, z, CANNON.Body.STATIC, 0);
  const mesh = makeMesh(0x3f7fd0);
  mesh.position.copy(body.position);
  scene.add(mesh);
  cubes.push({ mesh, body });

  anchored = true; anchorX = x; anchorZ = z; groundY = y; stackTopY = y + CUBE_SIZE; count = 1;
  scoreEl.textContent = "1 cubo";
  spawnStaging();
}

function spawnStaging() {
  const mesh = makeMesh(0xffd166);
  const body = makeBody(anchorX + STAGE_OFFSET, groundY + CUBE_SIZE/2, anchorZ, CANNON.Body.STATIC, 0);
  mesh.position.copy(body.position);
  scene.add(mesh);
  staging = { mesh, body };
  hintEl.textContent = "Pinzá cerca del cubo amarillo para agarrarlo, movés la mano para llevarlo, soltás para apilarlo";
}

// tomar el cubo del piso (desde donde lo hayas cargado) y soltarlo (con física real) arriba de la torre
function promoteStaging() {
  if (!staging) return;
  const jx = staging.body.position.x + (Math.random()-0.5) * JITTER * 2;
  const jz = staging.body.position.z + (Math.random()-0.5) * JITTER * 2;
  staging.body.position.set(jx, stackTopY + CUBE_SIZE*1.6, jz);
  staging.body.type = CANNON.Body.DYNAMIC;
  staging.body.mass = 0.05;
  staging.body.updateMassProperties();
  staging.body.velocity.set(0,0,0);
  staging.body.angularVelocity.set(0,0,0);
  staging.body.wakeUp();
  cubes.push(staging);
  stackTopY += CUBE_SIZE;
  count++;
  scoreEl.textContent = `${count} cubos`;
  staging = null;
  spawnStaging();
}

let hitTestSource = null, hitTestSourceRequested = false;

const controller = renderer.xr.getController(0);
controller.addEventListener("select", () => {
  // el toque SOLO ancla la torre la primera vez; agregar cubos es exclusivamente con la pinza
  if (!anchored && reticle.visible) {
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scale = new THREE.Vector3();
    reticle.matrix.decompose(pos, quat, scale);
    placeAnchor(pos.x, pos.y, pos.z);
    reticle.visible = false;
  }
});
scene.add(controller);

// ---------- EXPERIMENTAL: leer la cámara real de la sesión AR y pasarla a MediaPipe ----------
// para detectar la pinza de una mano. Si algo de esto falla (el feature no está disponible,
// el navegador no lo soporta, etc.) el juego sigue funcionando con el toque en pantalla.
let glBinding = null, handLandmarker = null;
let camCanvas = null, camCtx = null, fb = null;
let lastPinchCheck = 0, wasPinching = false, lastTrigger = 0;
const PINCH_INTERVAL_MS = 130;    // no correr esto cada cuadro -> es una lectura de GPU cara
// histéresis (como en el resto de los prototipos): cerrar y abrir usan umbrales distintos,
// si no el temblor natural de la mano hace "parpadear" la pinza cerca de un único umbral
// y dispara varias veces seguidas -> eso era el "tira uno directo" + "cubos duplicados".
const PINCH_ON = 0.45, PINCH_OFF = 0.70;
const TRIGGER_COOLDOWN_MS = 700;  // además, cooldown duro tras cada disparo, por las dudas

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
function drawHandOnPreview(lm, color) {
  camCtx.strokeStyle = color; camCtx.lineWidth = 3;
  for (const [a,b] of HAND_CONNECTIONS) {
    camCtx.beginPath();
    camCtx.moveTo(lm[a].x*camCanvas.width, lm[a].y*camCanvas.height);
    camCtx.lineTo(lm[b].x*camCanvas.width, lm[b].y*camCanvas.height);
    camCtx.stroke();
  }
  camCtx.fillStyle = color;
  for (const p of lm) {
    camCtx.beginPath();
    camCtx.arc(p.x*camCanvas.width, p.y*camCanvas.height, 5, 0, Math.PI*2);
    camCtx.fill();
  }
}

function pinchRatio(lm, wl) {
  if (wl) {
    const d = (a,b) => Math.hypot(wl[a].x-wl[b].x, wl[a].y-wl[b].y, wl[a].z-wl[b].z);
    return d(4,8) / (d(0,9) || 1e-6);
  }
  const size = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y) || 1e-6;
  return Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y) / size;
}

FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm")
  .then(vision => HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "IMAGE", numHands: 1
  }))
  .then(hl => { handLandmarker = hl; debugEl.textContent = "mano: modelo listo"; })
  .catch(e => { debugEl.textContent = "mano: no se pudo cargar el modelo"; console.error(e); });

renderer.xr.addEventListener("sessionstart", () => {
  try {
    const session = renderer.xr.getSession();
    const gl = renderer.getContext();
    glBinding = new XRWebGLBinding(session, gl);
    fb = gl.createFramebuffer();
    camCanvas = document.createElement("canvas");
    camCanvas.id = "camPreview";        // visible en pantalla -> confirma en vivo qué ve/trackea
    document.body.appendChild(camCanvas);
    camCtx = camCanvas.getContext("2d", { willReadFrequently: true });
    debugEl.textContent = "cámara AR: binding ok";
  } catch (e) {
    glBinding = null;
    debugEl.textContent = "cámara AR: no disponible (queda solo el toque)";
    console.error(e);
  }
});
renderer.xr.addEventListener("sessionend", () => { glBinding = null; });

function flipRowsY(pixels, width, height) {
  const rowBytes = width*4, tmp = new Uint8Array(rowBytes);
  for (let y=0; y<height/2; y++) {
    const top=y*rowBytes, bottom=(height-1-y)*rowBytes;
    tmp.set(pixels.subarray(top, top+rowBytes));
    pixels.copyWithin(top, bottom, bottom+rowBytes);
    pixels.set(tmp, bottom);
  }
}

function tryPinchFromCamera(frame, refSpace) {
  if (!glBinding || !handLandmarker || !staging) return;
  const now = performance.now();
  if (now - lastPinchCheck < PINCH_INTERVAL_MS) return;
  lastPinchCheck = now;

  const pose = frame.getViewerPose(refSpace);
  if (!pose) return;
  const view = pose.views.find(v => v.camera);
  if (!view) { debugEl.textContent = "cámara AR: feature no concedido"; return; }

  const gl = renderer.getContext();
  const texture = glBinding.getCameraImage(view.camera);
  if (!texture) return;
  const w = view.camera.width, h = view.camera.height;

  // OJO: en una sesión XR el framebuffer "real" NO es null -> hay que guardar el que estaba
  // puesto y restaurar ESE, no asumir null (eso corrompía el render de ahí en más -> se veía
  // "duplicado"/fantasma al mover, y de paso arruinaba la imagen que le pasábamos a MediaPipe).
  const prevFB = gl.getParameter(gl.FRAMEBUFFER_BINDING);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, prevFB);
    return;
  }
  const pixels = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  gl.bindFramebuffer(gl.FRAMEBUFFER, prevFB);
  flipRowsY(pixels, w, h);

  camCanvas.width = w; camCanvas.height = h;
  camCtx.putImageData(new ImageData(new Uint8ClampedArray(pixels.buffer), w, h), 0, 0);

  const result = handLandmarker.detect(camCanvas);
  const hand = result.landmarks && result.landmarks[0];
  if (!hand) { wasPinching = false; carrying = false; debugEl.textContent = "mano: no detectada"; return; }

  drawHandOnPreview(hand, carrying ? "#ffd166" : "#6cf08a");

  const ratio = pinchRatio(hand, result.worldLandmarks && result.worldLandmarks[0]);
  const threshold = wasPinching ? PINCH_OFF : PINCH_ON;   // histéresis: distinto umbral según el estado actual
  const pinching = ratio < threshold;

  // punto de pinza (medio entre pulgar e índice) proyectado sobre el piso real
  const pinchU = (hand[4].x + hand[8].x) / 2, pinchV = (hand[4].y + hand[8].y) / 2;
  const groundPt = imagePointToGround(pinchU, pinchV);

  if (!carrying) {
    if (pinching && !wasPinching && groundPt && now - lastTrigger > TRIGGER_COOLDOWN_MS) {
      const d = Math.hypot(groundPt.x - staging.body.position.x, groundPt.z - staging.body.position.z);
      if (d < GRAB_RADIUS) { carrying = true; hintEl.textContent = "Llevalo arriba de la torre y soltá los dedos para apilarlo"; }
    }
    debugEl.textContent = `mano: detectada · ${pinching ? "pinzando" : "abierta"}`;
  } else {
    if (pinching && groundPt) {
      staging.body.position.x = groundPt.x;
      staging.body.position.z = groundPt.z;
      staging.mesh.position.copy(staging.body.position);   // es STATIC -> no lo sincroniza el loop de física
      debugEl.textContent = "mano: cargando el cubo…";
    } else {
      carrying = false;
      lastTrigger = now;
      promoteStaging();
    }
  }
  wasPinching = pinching;
}

renderer.setAnimationLoop((timestamp, frame) => {
  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace("viewer").then(viewerSpace => {
        session.requestHitTestSource({ space: viewerSpace }).then(source => { hitTestSource = source; });
      });
      session.addEventListener("end", () => { hitTestSource = null; hitTestSourceRequested = false; });
      hitTestSourceRequested = true;
    }

    if (hitTestSource && !anchored) {
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length) {
        const pose = results[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    if (anchored) {
      try { tryPinchFromCamera(frame, refSpace); }
      catch (e) { debugEl.textContent = "mano: error de lectura (queda el toque)"; console.error(e); }
    }
  }

  world.fixedStep();
  for (const c of cubes) { c.mesh.position.copy(c.body.position); c.mesh.quaternion.copy(c.body.quaternion); }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
